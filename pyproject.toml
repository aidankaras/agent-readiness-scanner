[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-readiness-scanner"
version = "0.3.0"
description = "Score how ready an online store is for AI shopping agents (UCP, Google Universal Cart, ChatGPT shopping)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aidan Karas" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["ecommerce", "ai-agents", "ucp", "structured-data", "seo"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ars = "ars.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
